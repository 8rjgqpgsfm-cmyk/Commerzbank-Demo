version: '3.8'

services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8571:8080"

  service-registry:
    build: ./Service-Registry
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./API-Gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://service-registry:8761/eureka
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET:-}
    depends_on:
      service-registry:
        condition: service_healthy

  user-service:
    build: ./User-Service
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      EUREKA_URL: http://service-registry:8761/eureka
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  account-service:
    build: ./Account-Service
    ports:
      - "8081:8081"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      EUREKA_URL: http://service-registry:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  sequence-generator:
    build: ./Sequence-Generator
    ports:
      - "8083:8083"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      EUREKA_URL: http://service-registry:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  transaction-service:
    build: ./Transaction-Service
    ports:
      - "8084:8084"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      EUREKA_URL: http://service-registry:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  fund-transfer:
    build: ./Fund-Transfer
    ports:
      - "8085:8085"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      EUREKA_URL: http://service-registry:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_healthy

volumes:
  mysql-data:
